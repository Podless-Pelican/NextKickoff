name: Sync UEFA fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run scrape:uefa
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
